name: Build macOS Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install ninja sccache

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Generate gitinfo.h
        run: |
          printf '#define GIT_BRANCH main\n#define GIT_VERSION 4.x\n#define GIT_COMMITS 0\n' > src/gitinfo.h
          cat src/gitinfo.h

      - name: Configure
        run: cmake --preset macos-release

      - name: Build
        run: cmake --build --preset macos-release

      - name: Package app
        run: |
          mkdir -p release/ValbuenaClient-macOS-AppleSilicon

          if [ -d "build/macos-release/OTClient.app" ]; then
            cp -R "build/macos-release/OTClient.app" "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app"
          elif [ -d "OTClient.app" ]; then
            cp -R "OTClient.app" "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app"
          else
            find . -maxdepth 5 -name "*.app"
            exit 1
          fi

          cp -R data release/ValbuenaClient-macOS-AppleSilicon/data
          cp -R modules release/ValbuenaClient-macOS-AppleSilicon/modules
          cp -R mods release/ValbuenaClient-macOS-AppleSilicon/mods
          cp init.lua release/ValbuenaClient-macOS-AppleSilicon/init.lua
          cp README-MAC.txt release/ValbuenaClient-macOS-AppleSilicon/README-MAC.txt

          chmod +x "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app/Contents/MacOS/OTClient"

          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable OTClient" "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ValbuenaClient" "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ValbuenaClient" "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app/Contents/Info.plist"

          codesign --force --deep --sign - "release/ValbuenaClient-macOS-AppleSilicon/ValbuenaClient.app"

          ditto -c -k --sequesterRsrc --keepParent "release/ValbuenaClient-macOS-AppleSilicon" "ValbuenaClient-macOS-AppleSilicon.zip"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValbuenaClient-macOS-AppleSilicon
          path: ValbuenaClient-macOS-AppleSilicon.zip


